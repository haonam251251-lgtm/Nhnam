<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANGNHAP</title>
<style>
body {
  min-height:95vh;
  margin: 0;

  background-image: url(H%C3%ACnh%20%E1%BA%A3nh/2026.png);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
}



</style>
</head>

<body>
<div class="container d-flex justify-content-center mt-5">
  <div class="col-md-5">

    <!-- KHUNG BỌC FORM -->
    <div class="bg-white border rounded-4 p-4 shadow-sm">

      <h4 class="fw-bold text-center mb-4">Đăng nhập</h4>

      <form>

        <!-- TÊN ĐĂNG NHẬP -->
        <div class="mb-3">
          <label class="form-label">Tên đăng nhập</label>
          <div class="input-group">
            <span class="input-group-text">
              <i.paramem <i class="bi bi-person-fill"></i>
            </span>
            <input type="text" class="form-control" placeholder="Nhập tên đăng nhập">
          </div>
        </div>

        <!-- MẬT KHẨU -->
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock-fill"></i>
            </span>
            <input type="password" class="form-control" placeholder="Nhập mật khẩu">
          </div>
        </div>

        <!-- LINK ĐĂNG KÝ -->
        <div class="text-end mb-3">
          <small>
            Bạn chưa có tài khoản?
            <a href="DANGKY.html" class="text-primary fw-semibold text-decoration-none">
              Đăng ký ngay
            </a>
          </small>
        </div>

        <!-- BUTTON -->
       <a href="TrangChuWeb.html"
           class="btn btn-primary w-100 fw-semibold py-2 text-decoration-none">
           Đăng nhập
       </a>

      </form>

    </div>

  </div>
</div>


</body>
</html>
