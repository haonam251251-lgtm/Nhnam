<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
/* ===== LAYOUT ===== */
body {
    margin: 0;
    background-color: #EFEFEA;
}

.layout {
    display: flex;
    min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 240px;
    background-image: url(H%C3%ACnh%20%E1%BA%A3nh/MauChuyenSac.png);
    background-size: cover;
    background-position: center;
    color: #fff;
    padding: 20px;
}

/* Avatar */
.sidebar-avatar {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
}

.sidebar-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ===== MENU ===== */
.menu {
    list-style: none;
    padding: 0;
    margin: 0;
}

.menu li {
    margin-bottom: 10px;
}

.menu a {
    position: relative;
    display: block;
    padding: 12px 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
    z-index: 1;
}

.menu a::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% + 20px);
    height: 100%;
    background-color: #EFEFEA;
    border-radius: 999px 0 0 100px;
    opacity: 0;
    transition: 0.2s;
    z-index: -1;
}

.menu a:hover::before,
.menu a.active::before {
    opacity: 1;
}

.menu a:hover,
.menu a.active {
    color: #0d6efd;
}

/* ===== MAIN CONTENT ===== */
.main-content {
    flex: 1;
    padding: 30px;
    background-color: #EFEFEA;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 992px) {
    .sidebar {
        width: 200px;
        padding: 15px;
    }

    .sidebar-avatar {
        width: 90px;
        height: 90px;
        margin-bottom: 15px;
    }

    .menu a {
        font-size: 14px;
        padding: 10px 12px;
    }

    .menu a::before {
        width: calc(100% + 12px);
    }

    .main-content {
        padding: 20px;
    }
}

@media (max-width: 768px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .sidebar-avatar {
        width: 70px;
        height: 70px;
        margin: 0;
    }

    .menu {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .menu li {
        margin-bottom: 0;
    }

    .menu a {
        padding: 8px 12px;
        font-size: 13px;
        white-space: nowrap;
    }

    .menu a::before {
        width: 100%;
        border-radius: 999px;
    }

    .main-content {
        padding: 15px;
    }

    .main-content .col-6 {
        width: 100%;
    }

    .main-content img {
        margin-bottom: 15px;
    }
}

@media (max-width: 480px) {
    .menu {
        justify-content: center;
    }

    .menu a {
        font-size: 12px;
        padding: 6px 10px;
    }
}
/* ======================================================*/
  					/*SEARCH*/  
	.search-wrapper {
    width: 100%;
    max-width: none;
    position: relative;
	}

	.search-box {
		height: 52px;
		border-radius: 999px;
		padding-left: 45px;
		padding-right: 90px;
		border: none;
		font-size: 16px;
	}
	
	/* Icon */
	.search-icon-left {
		position: absolute;
		left: 18px;
		top: 50%;
		transform: translateY(-50%);
		color: #666;
	}
	
	.search-icon-right {
		position: absolute;
		right: 18px;
		top: 50%;
		transform: translateY(-50%);
		color: #0d6efd;
		font-size: 18px;
	}
/* ====================================================== */

</style>
</head>

<body style="background-color:#EFEFEA">

            <li><a href="Danh mục quản trị/KHACHHANG.html">KHÁCH HÀNG</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
    <!-------------------------------------------------------------------------------------->
    	<div class="container">
        	<form class="d-flex flex-grow-1 mx-4" role="search">
                    <div class="search-wrapper">
                        <i class="bi bi-search search-icon-left"></i>
                
                        <input type="search"
                               class="form-control search-box"
                               placeholder="Tìm kiếm">
                
                        <div class="search-icon-right">

        </div>

        <div class="row" style="margin-top:2%">

            </div>

    </div>
	<!-------------------------------------------------------------------------------------->
</div>
